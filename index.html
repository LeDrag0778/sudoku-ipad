<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#f6f7fb"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>Sudoku</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#243247;background:#f6f7fb}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}main{max-width:620px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;margin:12px 0}h1{font-size:29px;margin:0;color:#183858}button,select{font:inherit}button{border:0;border-radius:12px;padding:12px 14px;background:#dce8f8;color:#163956;font-weight:650;cursor:pointer}button:active{transform:scale(.97)}button.primary{background:#2467a7;color:white}button:disabled{opacity:.35}select{border:1px solid #c9d6e5;border-radius:10px;background:white;padding:10px;color:#233b54;min-width:142px}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.info{display:flex;justify-content:space-between;color:#617085;font-size:14px;margin:15px 2px 10px}.board{width:100%;aspect-ratio:1;border:3px solid #243b58;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);background:#fff;touch-action:manipulation;user-select:none}.cell{display:flex;align-items:center;justify-content:center;border-right:1px solid #c7d2df;border-bottom:1px solid #c7d2df;font-size:clamp(19px,5.7vw,31px);background:#fff;padding:0;color:#2467a7;border-radius:0;font-weight:500}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+73){border-bottom:0}.cell.boxright{border-right:2px solid #243b58}.cell.boxbottom{border-bottom:2px solid #243b58}.cell.fixed{font-weight:750;color:#26374c}.cell.peer{background:#edf3f9}.cell.same{background:#d9e9fb}.cell.selected{background:#a8ccef}.cell.error{color:#d32f45;background:#ffe4e7}.cell.notes{font-size:clamp(9px,2vw,12px);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);line-height:1.1;color:#667e9e}.cell.notes span{text-align:center}.tools,.numbers{display:grid;gap:7px;margin-top:12px}.numbers{grid-template-columns:repeat(9,1fr)}.numbers button{font-size:clamp(18px,4vw,25px);padding:14px 0}.tools{grid-template-columns:repeat(4,1fr)}.tools button{font-size:13px;padding:12px 2px}.tools .active{background:#2467a7;color:white}.message{min-height:28px;text-align:center;color:#276aa7;margin:12px 0}small{display:block;text-align:center;color:#687588;margin:14px 0 20px}@media(max-width:420px){.tools button{font-size:11px}.numbers{gap:3px}.numbers button{padding:12px 0}.cell{font-size:22px}}@media(hover:hover){button:hover{filter:brightness(.96)}}
</style></head><body><main><header><h1>Sudoku</h1><button id="new" class="primary">Neues Spiel</button></header><div class="bar"><label for="level">Schwierigkeit</label><select id="level"><option value="0">1 · Sehr leicht</option><option value="1">2 · Leicht</option><option value="2">3 · Mittel</option><option value="3">4 · Schwer</option><option value="4">5 · Experte</option><option value="5">6 · Meister</option></select></div><div class="info"><span id="levelText">Sehr leicht</span><span id="timer">00:00</span><span id="filled">0 / 81</span></div><div class="board" id="board" role="grid" aria-label="Sudoku Spielfeld"></div><div class="numbers" id="numbers"></div><div class="tools"><button id="notes">✎ Notizen</button><button id="erase">⌫ Löschen</button><button id="undo">↶ Zurück</button><button id="hint">💡 Tipp</button></div><div class="message" id="message" aria-live="polite"></div><small>Offline · Ohne Anmeldung · Spielstand auf diesem Gerät</small></main><script>
'use strict';const $=id=>document.getElementById(id), names=['Sehr leicht','Leicht','Mittel','Schwer','Experte','Meister'];let state,selected=-1,noteMode=false,undo=[];const STORAGE='ipad-sudoku-v1';const indices=Array.from({length:81},(_,i)=>i), rand=n=>Math.floor(Math.random()*n);function shuffle(a){for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}function mask(row,col){return 1<<(row*9+col)}function possible(b,i){let r=i/9|0,c=i%9,used=0;for(let k=0;k<9;k++){if(b[r*9+k])used|=1<<b[r*9+k];if(b[k*9+c])used|=1<<b[k*9+c];let br=3*(r/3|0)+(k/3|0),bc=3*(c/3|0)+k%3;if(b[br*9+bc])used|=1<<b[br*9+bc]}return Array.from({length:9},(_,k)=>k+1).filter(v=>!(used&(1<<v)))}function solve(b,limit=1,random=false){let count=0,first=null;function walk(){let best=-1,opts=null;for(let i=0;i<81;i++)if(!b[i]){let p=possible(b,i);if(!p.length)return false;if(!opts||p.length<opts.length){best=i;opts=p;if(p.length===1)break}}if(best===-1){count++;if(!first)first=b.slice();return count>=limit}if(random)shuffle(opts);for(let v of opts){b[best]=v;if(walk()){b[best]=0;return true}b[best]=0}return false}walk();return {count,solution:first}}function make(level){let b=Array(81).fill(0),solution=solve(b,1,true).solution;let p=solution.slice(),target=[42,37,32,27,24,22][level],order=shuffle(indices.slice());for(let i of order){if(p.filter(Boolean).length<=target)break;let saved=p[i];p[i]=0;if(solve(p.slice(),2).count!==1)p[i]=saved}return {solution,puzzle:p,values:p.slice(),notes:Array.from({length:81},()=>[]),level,seconds:0,complete:false}}function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}}function load(){try{let s=JSON.parse(localStorage.getItem(STORAGE));if(s&&s.puzzle?.length===81&&s.solution?.length===81&&s.values?.length===81&&s.notes?.length===81&&s.level>=0&&s.level<6)return s}catch(e){}return null}function render(){let board=$('board');board.textContent='';let sr=selected/9|0,sc=selected%9;for(let i=0;i<81;i++){let r=i/9|0,c=i%9,v=state.values[i],el=document.createElement('button');el.className='cell';el.setAttribute('role','gridcell');el.setAttribute('aria-label',`Zeile ${r+1}, Spalte ${c+1}, ${v||'leer'}`);if(c===2||c===5)el.classList.add('boxright');if(r===2||r===5)el.classList.add('boxbottom');if(state.puzzle[i])el.classList.add('fixed');if(selected!==-1&&(r===sr||c===sc||(r/3|0)===(sr/3|0)&&(c/3|0)===(sc/3|0)))el.classList.add('peer');if(selected!==-1&&state.values[selected]&&state.values[selected]===v)el.classList.add('same');if(i===selected)el.classList.add('selected');if(v&&v!==state.solution[i]&&!state.puzzle[i])el.classList.add('error');if(v)el.textContent=v;else if(state.notes[i]?.length){el.classList.add('notes');for(let k=1;k<=9;k++){let sp=document.createElement('span');sp.textContent=state.notes[i].includes(k)?k:'';el.append(sp)}}el.onclick=()=>{selected=i;render()};board.append(el)}$('level').value=String(state.level);$('levelText').textContent=names[state.level];$('filled').textContent=`${state.values.filter(Boolean).length} / 81`;$('notes').classList.toggle('active',noteMode);$('undo').disabled=!undo.length;$('message').textContent=state.complete?'Geschafft! 🎉':state.values.some((v,i)=>v&&v!==state.solution[i])?'Rot markierte Zahlen sind noch falsch.':'';clock()}function clock(){let m=state.seconds/60|0,s=state.seconds%60;$('timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}function snapshot(){undo.push({values:state.values.slice(),notes:state.notes.map(n=>n.slice()),complete:state.complete});if(undo.length>100)undo.shift()}function setNumber(v){if(selected<0||state.puzzle[selected]||state.complete)return;snapshot();if(noteMode&&v){let a=state.notes[selected],k=a.indexOf(v);if(k<0)a.push(v);else a.splice(k,1)}else{state.values[selected]=v;state.notes[selected]=[];}if(state.values.every((v,i)=>v===state.solution[i]))state.complete=true;save();render()}function start(){let level=+$('level').value;if(state&&!confirm('Ein neues Spiel starten? Der bisherige Spielstand wird ersetzt.'))return;state=make(level);selected=-1;noteMode=false;undo=[];save();render()}$('new').onclick=start;$('level').onchange=()=>{let level=+$('level').value;if(confirm('Neues Spiel auf Stufe '+(level+1)+' starten? Der alte Spielstand wird ersetzt.')){state=make(level);selected=-1;noteMode=false;undo=[];save();render()}else render()};for(let n=1;n<=9;n++){let b=document.createElement('button');b.textContent=n;b.onclick=()=>setNumber(n);$('numbers').append(b)}$('notes').onclick=()=>{noteMode=!noteMode;render()};$('erase').onclick=()=>setNumber(0);$('undo').onclick=()=>{if(!undo.length)return;Object.assign(state,undo.pop());save();render()};$('hint').onclick=()=>{if(selected<0||state.puzzle[selected]||state.complete)return;if(!confirm('Die richtige Zahl in diesem Feld eintragen?'))return;snapshot();state.values[selected]=state.solution[selected];state.notes[selected]=[];if(state.values.every((v,i)=>v===state.solution[i]))state.complete=true;save();render()};document.addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='9')setNumber(+e.key);if(e.key==='Backspace'||e.key==='Delete')setNumber(0);if((e.ctrlKey||e.metaKey)&&e.key==='z'){$('undo').click();e.preventDefault()}if(selected>=0&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){let d={ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[e.key],n=selected+d;if(n>=0&&n<81&&!(e.key==='ArrowLeft'&&selected%9===0)&&!(e.key==='ArrowRight'&&selected%9===8)){selected=n;render()}e.preventDefault()}});state=load()||make(0);$('level').value=String(state.level);render();setInterval(()=>{if(!state.complete&&!document.hidden){state.seconds++;clock();if(state.seconds%5===0)save()}},1000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
